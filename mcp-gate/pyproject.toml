[project]
name = "mcp-gate"
version = "0.1.1"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp>=4.1.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mcp-gate = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
